<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Master the language of sustainability — learn ESG and regulatory jargon with flashcards, quizzes, and a daily practice streak.">
  <meta name="theme-color" content="#008631">

  <!-- Social preview (LinkedIn, Slack, Twitter/X) when this link is shared -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://app.sustainwiseapp.com/">
  <meta property="og:title" content="SustainWise">
  <meta property="og:description" content="Master the language of sustainability — learn ESG and regulatory jargon with flashcards, quizzes, and a daily practice streak.">
  <meta property="og:image" content="https://app.sustainwiseapp.com/icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="SustainWise">
  <meta name="twitter:description" content="Master the language of sustainability — learn ESG and regulatory jargon with flashcards, quizzes, and a daily practice streak.">
  <meta name="twitter:image" content="https://app.sustainwiseapp.com/icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SustainWise">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SustainWise</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    esg_content.json (the term/quiz database) and the Dart-compiled JS are
    both fetched over the network on web, unlike the native app's bundled
    assets — on a slow connection there'd otherwise be a blank cream page
    for a few seconds with no indication anything is happening. Removed
    once the engine is ready, right before runApp(), via the loader hook
    below.
  -->
  <div id="loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F7F3E8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <div style="width:34px;height:34px;border-radius:50%;border:3px solid #E5E2D6;border-top-color:#008631;animation:sw-spin 0.8s linear infinite;"></div>
    <span style="font-size:14px;font-weight:600;color:#667069;">Loading SustainWise…</span>
  </div>
  <style>
    @keyframes sw-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading div:first-child { animation: none; border-top-color: #E5E2D6; }
    }
    /*
      An earlier global `flutter-view { filter: saturate(80%); }` rule
      lived here — replaced by a Flutter-native ColorFiltered wrapper
      scoped to just the learning-path section (see
      lib/web/desaturated_path.dart), per review feedback that a blanket
      canvas filter also dulled icons/badges it wasn't meant to touch.
    */
  </style>

  <script>
    window.addEventListener('load', function () {
      _flutter.loader.load({
        onEntrypointLoaded: async function (engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine();
          const loading = document.getElementById('loading');
          if (loading) loading.remove();
          await appRunner.runApp();
        },
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
