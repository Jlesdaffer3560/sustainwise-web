name: Deploy web build to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: flutter build web --release --base-href /

      # GitHub Pages serves this for any path with no matching file (e.g. a
      # direct visit or refresh on /glossary). Making it identical to
      # index.html lets the app boot normally there too, so its own
      # go_router picks the right screen from the URL client-side.
      - run: cp build/web/index.html build/web/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
